    <path d="M 36 62 L 78 142 L 68 174 L 28 166 Z" fill="url(#silver_left)"/>
    <path d="M 36 62 L 78 142 L 52 118 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Right Wing of M -->
    <path d="M 204 62 L 162 142 L 172 174 L 212 166 Z" fill="#CBD5E1"/>
    <path d="M 204 62 L 162 142 L 188 118 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- S Core -->
    <path d="M 124 58 C 154 58 170 74 170 94 C 170 114 148 126 118 133 L 94 139 C 68 145 52 157 52 174 C 52 194 72 206 102 206 C 132 206 152 194 164 180" 
          stroke="url(#lockup_blue)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 124 58 C 104 58 88 68 88 84" 
