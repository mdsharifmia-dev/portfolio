<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="280" cy="200" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="920" cy="480" r="180" fill="#6366f1" opacity="0.10" filter="url(#glow)" />

  <!-- Architecture Flow Lines -->
  <path d="M 320 338 L 460 338 M 740 338 L 880 338" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />
  <path d="M 600 240 L 600 170 M 600 435 L 600 505" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Left Node: Sensory Input & Event Stream -->
  <g transform="translate(100, 248)">
    <rect width="220" height="180" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="24" width="36" height="36" rx="8" fill="rgba(56, 189, 248, 0.15)" />
    <path d="M 38 34 L 38 50 M 30 42 L 46 42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="68" y="47" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="16" font-weight="600">Event Stream</text>
    <text x="20" y="95" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="400">Telegram Webhooks</text>
    <text x="20" y="120" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="400">Scheduled Cron Triggers</text>
    <text x="20" y="145" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="400">REST API Ingestion</text>
  </g>

  <!-- Center Node: Autonomous Reasoning Core (Gemini 3.8 Flash) -->
  <g transform="translate(460, 218)">
    <rect width="280" height="240" rx="20" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" filter="url(#glow)" />
    <rect x="24" y="24" width="44" height="44" rx="10" fill="url(#cyan-glow)" />
    <circle cx="46" cy="46" r="10" fill="#0f172a" />
    <circle cx="46" cy="46" r="4" fill="#38bdf8" />
    <text x="80" y="45" fill="#ffffff" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="18" font-weight="700">Autonomous Core</text>
    <text x="80" y="64" fill="#38bdf8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12" font-weight="500">Multimodal Agent Engine</text>

    <!-- Inner Micro-components -->
    <rect x="24" y="90" width="232" height="36" rx="8" fill="#1e293b" />
    <text x="36" y="113" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">State Machine &amp; Planner</text>

    <rect x="24" y="136" width="232" height="36" rx="8" fill="#1e293b" />
    <text x="36" y="159" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Self-Healing Memory Buffer</text>

    <rect x="24" y="182" width="232" height="36" rx="8" fill="#1e293b" />
    <text x="36" y="205" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Structured Tool Schema Execution</text>
  </g>

  <!-- Top Auxiliary Node: Vector Context & Grounding -->
  <g transform="translate(490, 80)">
    <rect width="220" height="90" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="20" y="38" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">Vector Knowledge Base</text>
    <text x="20" y="64" fill="#38bdf8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">pgvector Embeddings &amp; Cache</text>
  </g>

  <!-- Bottom Auxiliary Node: Execution Tool Harness -->
  <g transform="translate(490, 505)">
    <rect width="220" height="90" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="20" y="38" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">Deterministic Toolset</text>
    <text x="20" y="64" fill="#818cf8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Browser, Code Sandbox, DB Sync</text>
  </g>

  <!-- Right Node: Multi-Channel Autonomous Dispatch -->
  <g transform="translate(880, 248)">
    <rect width="220" height="180" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="24" width="36" height="36" rx="8" fill="rgba(129, 140, 248, 0.15)" />
    <path d="M 30 42 L 46 42 M 40 36 L 46 42 L 40 48" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="47" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="16" font-weight="600">Action Dispatch</text>
    <text x="20" y="95" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="400">Instant Telegram Broadcast</text>
    <text x="20" y="120" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="400">PostgreSQL State Record</text>
    <text x="20" y="145" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="400">CRM Lead Automation</text>
  </g>

  <!-- Top Badge: Category Pill -->
  <g transform="translate(100, 50)">
    <rect width="180" height="36" rx="18" fill="rgba(14, 165, 233, 0.12)" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="34" y="23" fill="#38bdf8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">AI ARCHITECTURE</text>
  </g>
</svg>
