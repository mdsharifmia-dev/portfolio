<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="n8n-grad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#19152b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="n8n-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6d5a" />
      <stop offset="100%" stop-color="#ea4b35" />
    </linearGradient>
    <pattern id="n8n-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <filter id="n-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#n8n-grad)" />
  <rect width="1200" height="675" fill="url(#n8n-grid)" />

  <circle cx="300" cy="300" r="160" fill="#ff6d5a" opacity="0.08" filter="url(#n-glow)" />
  <circle cx="900" cy="350" r="160" fill="#38bdf8" opacity="0.08" filter="url(#n-glow)" />

  <!-- Pipeline Connectors -->
  <path d="M 320 338 L 460 338 M 740 338 L 880 338" stroke="#ff6d5a" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />
  <path d="M 600 240 L 600 170 M 600 435 L 600 505" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Node 1: Inbound Webhook Event -->
  <g transform="translate(100, 248)">
    <rect width="220" height="180" rx="16" fill="#1f1b2e" stroke="#3d3559" stroke-width="1.5" />
    <rect x="20" y="24" width="36" height="36" rx="8" fill="rgba(255, 109, 90, 0.15)" />
    <circle cx="38" cy="42" r="8" fill="#ff6d5a" />
    <text x="68" y="47" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="16" font-weight="600">Event Trigger</text>
    <text x="20" y="95" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Stripe &amp; PayPal Webhooks</text>
    <text x="20" y="120" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Google Forms / Sheets</text>
    <text x="20" y="145" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Custom REST Endpoints</text>
  </g>

  <!-- Node 2: Self-Healing Workflow Core -->
  <g transform="translate(460, 218)">
    <rect width="280" height="240" rx="20" fill="#141120" stroke="#ff6d5a" stroke-width="2" filter="url(#n-glow)" />
    <rect x="24" y="24" width="44" height="44" rx="10" fill="url(#n8n-orange)" />
    <text x="80" y="45" fill="#ffffff" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="18" font-weight="700">Self-Healing n8n</text>
    <text x="80" y="64" fill="#ff6d5a" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12" font-weight="500">Idempotent Execution Bus</text>

    <rect x="24" y="90" width="232" height="36" rx="8" fill="#241f37" />
    <text x="36" y="113" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Redis Idempotency Locks</text>

    <rect x="24" y="136" width="232" height="36" rx="8" fill="#241f37" />
    <text x="36" y="159" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Exponential Backoff Retries</text>

    <rect x="24" y="182" width="232" height="36" rx="8" fill="#241f37" />
    <text x="36" y="205" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Schema Validation &amp; Dead-Letters</text>
  </g>

  <!-- Auxiliary Node Top -->
  <g transform="translate(490, 80)">
    <rect width="220" height="90" rx="14" fill="#1f1b2e" stroke="#3d3559" stroke-width="1.5" />
    <text x="20" y="38" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">State Persistence</text>
    <text x="20" y="64" fill="#ff6d5a" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">PostgreSQL &amp; Audit Logs</text>
  </g>

  <!-- Auxiliary Node Bottom -->
  <g transform="translate(490, 505)">
    <rect width="220" height="90" rx="14" fill="#1f1b2e" stroke="#3d3559" stroke-width="1.5" />
    <text x="20" y="38" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">Error Fallback Node</text>
    <text x="20" y="64" fill="#38bdf8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Discord &amp; Slack Incident Alerts</text>
  </g>

  <!-- Node 3: Outbound Synchronization -->
  <g transform="translate(880, 248)">
    <rect width="220" height="180" rx="16" fill="#1f1b2e" stroke="#3d3559" stroke-width="1.5" />
    <rect x="20" y="24" width="36" height="36" rx="8" fill="rgba(56, 189, 248, 0.15)" />
    <circle cx="38" cy="42" r="8" fill="#38bdf8" />
    <text x="68" y="47" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="16" font-weight="600">Real-Time Sync</text>
    <text x="20" y="95" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">CRM Record Updated</text>
    <text x="20" y="120" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Inventory Reconciled</text>
    <text x="20" y="145" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Instant Client Notification</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 50)">
    <rect width="240" height="36" rx="18" fill="rgba(255, 109, 90, 0.12)" stroke="#ff6d5a" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#ff6d5a" />
    <text x="34" y="23" fill="#ff6d5a" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">WORKFLOW ORCHESTRATION</text>
  </g>
</svg>
