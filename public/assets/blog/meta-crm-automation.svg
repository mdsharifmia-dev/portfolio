<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="meta-grad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050e14" />
      <stop offset="50%" stop-color="#0b1b24" />
      <stop offset="100%" stop-color="#04090d" />
    </linearGradient>
    <linearGradient id="wa-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25d366" />
      <stop offset="100%" stop-color="#128c7e" />
    </linearGradient>
    <pattern id="meta-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#meta-grad)" />
  <rect width="1200" height="675" fill="url(#meta-grid)" />

  <circle cx="300" cy="300" r="160" fill="#25d366" opacity="0.08" filter="url(#green-glow)" />
  <circle cx="900" cy="350" r="160" fill="#0081fb" opacity="0.08" filter="url(#green-glow)" />

  <!-- Data Flow Lines -->
  <path d="M 320 338 L 460 338 M 740 338 L 880 338" stroke="#25d366" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />
  <path d="M 600 240 L 600 170 M 600 435 L 600 505" stroke="#0081fb" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Node 1: Inbound Webhooks -->
  <g transform="translate(100, 248)">
    <rect width="220" height="180" rx="16" fill="#13232c" stroke="#1f3d4d" stroke-width="1.5" />
    <rect x="20" y="24" width="36" height="36" rx="8" fill="rgba(37, 211, 102, 0.15)" />
    <circle cx="38" cy="42" r="8" fill="#25d366" />
    <text x="68" y="47" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="16" font-weight="600">Inbound Events</text>
    <text x="20" y="95" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">WhatsApp Cloud API</text>
    <text x="20" y="120" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Facebook Page Messages</text>
    <text x="20" y="145" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Instagram Direct Webhook</text>
  </g>

  <!-- Node 2: Fast Processing & Lead Routing Hub -->
  <g transform="translate(460, 218)">
    <rect width="280" height="240" rx="20" fill="#0d1b22" stroke="#25d366" stroke-width="2" filter="url(#green-glow)" />
    <rect x="24" y="24" width="44" height="44" rx="10" fill="url(#wa-green)" />
    <text x="80" y="45" fill="#ffffff" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="18" font-weight="700">Meta Webhook Hub</text>
    <text x="80" y="64" fill="#25d366" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12" font-weight="500">FastAPI &amp; HMAC Verification</text>

    <rect x="24" y="90" width="232" height="36" rx="8" fill="#182c35" />
    <text x="36" y="113" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">SHA256 Signature Validation</text>

    <rect x="24" y="136" width="232" height="36" rx="8" fill="#182c35" />
    <text x="36" y="159" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Contextual Intent Classifier</text>

    <rect x="24" y="182" width="232" height="36" rx="8" fill="#182c35" />
    <text x="36" y="205" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Lead Scoring &amp; State Engine</text>
  </g>

  <!-- Auxiliary Node Top -->
  <g transform="translate(490, 80)">
    <rect width="220" height="90" rx="14" fill="#13232c" stroke="#1f3d4d" stroke-width="1.5" />
    <text x="20" y="38" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">PostgreSQL CRM Store</text>
    <text x="20" y="64" fill="#25d366" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Customer Timeline &amp; History</text>
  </g>

  <!-- Auxiliary Node Bottom -->
  <g transform="translate(490, 505)">
    <rect width="220" height="90" rx="14" fill="#13232c" stroke="#1f3d4d" stroke-width="1.5" />
    <text x="20" y="38" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">Human Escalation Bridge</text>
    <text x="20" y="64" fill="#0081fb" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Telegram &amp; WhatsApp Alerts</text>
  </g>

  <!-- Node 3: Outbound Response & CRM Sync -->
  <g transform="translate(880, 248)">
    <rect width="220" height="180" rx="16" fill="#13232c" stroke="#1f3d4d" stroke-width="1.5" />
    <rect x="20" y="24" width="36" height="36" rx="8" fill="rgba(0, 129, 251, 0.15)" />
    <circle cx="38" cy="42" r="8" fill="#0081fb" />
    <text x="68" y="47" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="16" font-weight="600">Active Execution</text>
    <text x="20" y="95" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">&lt;1.2s Interactive Reply</text>
    <text x="20" y="120" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">CRM Deal Stage Upgrade</text>
    <text x="20" y="145" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Automated Order Confirm</text>
  </g>

  <!-- Badge -->
  <g transform="translate(100, 50)">
    <rect width="220" height="36" rx="18" fill="rgba(37, 211, 102, 0.12)" stroke="#25d366" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#25d366" />
    <text x="34" y="23" fill="#25d366" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">AUTOMATION PIPELINE</text>
  </g>
</svg>
