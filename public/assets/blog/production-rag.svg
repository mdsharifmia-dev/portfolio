<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="rag-grad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <pattern id="rag-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#rag-grad)" />
  <rect width="1200" height="675" fill="url(#rag-grid)" />

  <circle cx="280" cy="300" r="160" fill="#a855f7" opacity="0.08" filter="url(#p-glow)" />
  <circle cx="920" cy="360" r="160" fill="#38bdf8" opacity="0.08" filter="url(#p-glow)" />

  <!-- Data Flow Lines -->
  <path d="M 320 338 L 460 338 M 740 338 L 880 338" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />
  <path d="M 600 240 L 600 170 M 600 435 L 600 505" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Step 1: Document Chunking & Ingestion -->
  <g transform="translate(100, 248)">
    <rect width="220" height="180" rx="16" fill="#1e1b4b" stroke="#3730a3" stroke-width="1.5" />
    <rect x="20" y="24" width="36" height="36" rx="8" fill="rgba(168, 85, 247, 0.15)" />
    <path d="M 30 34 L 46 34 M 30 42 L 46 42 M 30 50 L 40 50" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
    <text x="68" y="47" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="16" font-weight="600">Document Parser</text>
    <text x="20" y="95" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Hierarchical Chunking</text>
    <text x="20" y="120" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Token Boundary Splitting</text>
    <text x="20" y="145" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Metadata Tagging</text>
  </g>

  <!-- Step 2: Vector Search & Hybrid Retrieval -->
  <g transform="translate(460, 218)">
    <rect width="280" height="240" rx="20" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#p-glow)" />
    <rect x="24" y="24" width="44" height="44" rx="10" fill="url(#purple-glow)" />
    <text x="80" y="45" fill="#ffffff" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="18" font-weight="700">Hybrid Retrieval</text>
    <text x="80" y="64" fill="#a855f7" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12" font-weight="500">Dense + Sparse Vector Match</text>

    <rect x="24" y="90" width="232" height="36" rx="8" fill="#1e1b4b" />
    <text x="36" y="113" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Supabase pgvector HNSW Index</text>

    <rect x="24" y="136" width="232" height="36" rx="8" fill="#1e1b4b" />
    <text x="36" y="159" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">BM25 Keyword Reciprocal Rank</text>

    <rect x="24" y="182" width="232" height="36" rx="8" fill="#1e1b4b" />
    <text x="36" y="205" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Cohere Re-ranking Cross-Encoder</text>
  </g>

  <!-- Top Auxiliary Node -->
  <g transform="translate(490, 80)">
    <rect width="220" height="90" rx="14" fill="#1e1b4b" stroke="#3730a3" stroke-width="1.5" />
    <text x="20" y="38" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">Embedding Engine</text>
    <text x="20" y="64" fill="#38bdf8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">text-embedding-004 (768-dim)</text>
  </g>

  <!-- Bottom Auxiliary Node -->
  <g transform="translate(490, 505)">
    <rect width="220" height="90" rx="14" fill="#1e1b4b" stroke="#3730a3" stroke-width="1.5" />
    <text x="20" y="38" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">Hallucination Guardrail</text>
    <text x="20" y="64" fill="#a855f7" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Faithfulness &amp; Grounding Check</text>
  </g>

  <!-- Step 3: Grounded Synthesized Intelligence -->
  <g transform="translate(880, 248)">
    <rect width="220" height="180" rx="16" fill="#1e1b4b" stroke="#3730a3" stroke-width="1.5" />
    <rect x="20" y="24" width="36" height="36" rx="8" fill="rgba(56, 189, 248, 0.15)" />
    <path d="M 30 42 L 46 42 M 40 36 L 46 42 L 40 48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="47" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="16" font-weight="600">Verified Answer</text>
    <text x="20" y="95" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Grounded Source Citations</text>
    <text x="20" y="120" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Sub-Second Vector Query</text>
    <text x="20" y="145" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Zero Hallucination Proof</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 50)">
    <rect width="230" height="36" rx="18" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#a855f7" />
    <text x="34" y="23" fill="#a855f7" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">SOFTWARE ARCHITECTURE</text>
  </g>
</svg>
