<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="motion-grad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#14142b" />
      <stop offset="100%" stop-color="#05050a" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="motion-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#motion-grad)" />
  <rect width="1200" height="675" fill="url(#motion-grid)" />

  <circle cx="300" cy="300" r="160" fill="#f59e0b" opacity="0.08" filter="url(#m-glow)" />
  <circle cx="900" cy="350" r="160" fill="#ec4899" opacity="0.08" filter="url(#m-glow)" />

  <!-- Smooth Kinetic Wave Curve -->
  <path d="M 100 460 C 300 240, 500 520, 700 280 C 900 120, 1050 420, 1100 320" stroke="url(#amber-glow)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#m-glow)" />

  <!-- 60fps Frame Budget Markers -->
  <line x1="200" y1="160" x2="200" y2="520" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4 4" />
  <line x1="450" y1="160" x2="450" y2="520" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4 4" />
  <line x1="700" y1="160" x2="700" y2="520" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4 4" />
  <line x1="950" y1="160" x2="950" y2="520" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4 4" />

  <!-- Metric Badges -->
  <g transform="translate(140, 200)">
    <rect width="200" height="90" rx="14" fill="#18182e" stroke="#2e2e54" stroke-width="1.5" />
    <text x="20" y="36" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Frame Budget</text>
    <text x="20" y="68" fill="#f59e0b" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="28" font-weight="700">16.6 ms</text>
    <text x="130" y="68" fill="#10b981" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">60 FPS</text>
  </g>

  <g transform="translate(500, 120)">
    <rect width="220" height="90" rx="14" fill="#18182e" stroke="#2e2e54" stroke-width="1.5" />
    <text x="20" y="36" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Scroll Physics Engine</text>
    <text x="20" y="66" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="20" font-weight="700">Lenis Dampening</text>
  </g>

  <g transform="translate(860, 200)">
    <rect width="200" height="90" rx="14" fill="#18182e" stroke="#2e2e54" stroke-width="1.5" />
    <text x="20" y="36" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Layout Shift</text>
    <text x="20" y="68" fill="#10b981" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="28" font-weight="700">0.000 CLS</text>
  </g>

  <!-- Bottom Panel: Code Preview Snippet -->
  <g transform="translate(280, 480)">
    <rect width="640" height="120" rx="16" fill="#0c0c17" stroke="#2e2e54" stroke-width="1.5" />
    <circle cx="24" cy="24" r="6" fill="#ef4444" />
    <circle cx="44" cy="24" r="6" fill="#f59e0b" />
    <circle cx="64" cy="24" r="6" fill="#10b981" />
    <text x="90" y="28" fill="#64748b" font-family="monospace" font-size="13">gsap.to('.magnetic-orb', { scrollTrigger: { scrub: 1.2 }, force3D: true });</text>
    <text x="90" y="58" fill="#38bdf8" font-family="monospace" font-size="13">const lenis = new Lenis({ lerp: 0.08, smoothWheel: true });</text>
    <text x="90" y="88" fill="#10b981" font-family="monospace" font-size="13">// Zero layout thrashing, GPU composite layer acceleration</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 50)">
    <rect width="210" height="36" rx="18" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#f59e0b" />
    <text x="34" y="23" fill="#f59e0b" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">KINETIC MOTION</text>
  </g>
</svg>
