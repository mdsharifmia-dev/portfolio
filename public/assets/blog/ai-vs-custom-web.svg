<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="web-grad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <pattern id="web-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <filter id="web-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#web-grad)" />
  <rect width="1200" height="675" fill="url(#web-grid)" />

  <circle cx="340" cy="340" r="160" fill="#f43f5e" opacity="0.06" filter="url(#web-glow)" />
  <circle cx="860" cy="340" r="160" fill="#10b981" opacity="0.08" filter="url(#web-glow)" />

  <!-- Split Divider with VS badge -->
  <line x1="600" y1="120" x2="600" y2="600" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="600" cy="360" r="28" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <text x="600" y="367" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">VS</text>

  <!-- Left Side: Generic AI Builders -->
  <g transform="translate(100, 140)">
    <rect width="440" height="440" rx="20" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.9" />
    <rect x="24" y="24" width="40" height="40" rx="8" fill="rgba(244, 63, 94, 0.15)" />
    <path d="M 36 36 L 52 52 M 52 36 L 36 52" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <text x="76" y="44" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="20" font-weight="700">AI Website Builders</text>
    <text x="76" y="66" fill="#f43f5e" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="500">Surface Speed / Architectural Debt</text>

    <!-- Metrics Card 1 -->
    <rect x="24" y="100" width="392" height="70" rx="12" fill="#0f172a" />
    <text x="44" y="130" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Lighthouse Performance</text>
    <text x="44" y="156" fill="#f43f5e" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="22" font-weight="700">42 / 100</text>
    <text x="160" y="156" fill="#64748b" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Heavy JS Runtime Overhead</text>

    <!-- Metrics Card 2 -->
    <rect x="24" y="186" width="392" height="70" rx="12" fill="#0f172a" />
    <text x="44" y="216" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">DOM Complexity &amp; Nesting</text>
    <text x="44" y="242" fill="#f43f5e" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="22" font-weight="700">3,400+ Nodes</text>
    <text x="210" y="242" fill="#64748b" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Layout Shift &amp; Bloat</text>

    <!-- Metrics Card 3 -->
    <rect x="24" y="272" width="392" height="136" rx="12" fill="#0f172a" />
    <text x="44" y="302" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">Fundamental Limitations:</text>
    <text x="44" y="330" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">• Vendor lock-in &amp; unexportable hosting</text>
    <text x="44" y="356" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">• Inability to integrate custom microservices</text>
    <text x="44" y="382" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">• Fragile breakpoint responsiveness</text>
  </g>

  <!-- Right Side: Custom Engineering (Astro 5 + Modern Stack) -->
  <g transform="translate(660, 140)">
    <rect width="440" height="440" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#web-glow)" />
    <rect x="24" y="24" width="40" height="40" rx="8" fill="rgba(16, 185, 129, 0.15)" />
    <path d="M 34 44 L 42 52 L 54 36" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="76" y="44" fill="#f8fafc" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="20" font-weight="700">Custom Engineering</text>
    <text x="76" y="66" fill="#10b981" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="500">Astro 5 Islands + Full-Stack APIs</text>

    <!-- Metrics Card 1 -->
    <rect x="24" y="100" width="392" height="70" rx="12" fill="#1e293b" />
    <text x="44" y="130" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Lighthouse Performance</text>
    <text x="44" y="156" fill="#10b981" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="22" font-weight="700">100 / 100</text>
    <text x="175" y="156" fill="#10b981" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Zero-JS Baseline / Sub-second</text>

    <!-- Metrics Card 2 -->
    <rect x="24" y="186" width="392" height="70" rx="12" fill="#1e293b" />
    <text x="44" y="216" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">Initial Bundle Footprint</text>
    <text x="44" y="242" fill="#10b981" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="22" font-weight="700">18 KB</text>
    <text x="135" y="242" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="12">Semantic Clean HTML5/Tailwind</text>

    <!-- Metrics Card 3 -->
    <rect x="24" y="272" width="392" height="136" rx="12" fill="#1e293b" />
    <text x="44" y="302" fill="#cbd5e1" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="14" font-weight="600">Enterprise Engineering Superpowers:</text>
    <text x="44" y="330" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">• Total ownership &amp; high-availability Docker</text>
    <text x="44" y="356" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">• Native Webhook &amp; PostgreSQL integration</text>
    <text x="44" y="382" fill="#94a3b8" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13">• Uncompromised 60fps kinetic motion</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 50)">
    <rect width="210" height="36" rx="18" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#10b981" />
    <text x="34" y="23" fill="#10b981" font-family="'Suisse Intl', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">WEB ENGINEERING</text>
  </g>
</svg>
